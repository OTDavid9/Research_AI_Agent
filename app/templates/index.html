<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #07080d;
      --surface:     #0e1018;
      --surface2:    #14161f;
      --border:      #1e2130;
      --border2:     #2a2e42;
      --accent:      #3dffa0;
      --accent-dim:  #1a7a4a;
      --accent-glow: rgba(61,255,160,0.18);
      --user-bg:     #111827;
      --user-border: #1f2b42;
      --text:        #d4dae8;
      --text-muted:  #5a6078;
      --text-dim:    #8892aa;
      --error:       #ff5f5f;
      --warning:     #ffb347;
      --mono:        'Berkeley Mono', 'Fira Code', 'Courier New', monospace;
      --sans:        'DM Sans', system-ui, sans-serif;
      --radius:      10px;
      --radius-lg:   16px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; overflow: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: .5;
    }

    #app { display: grid; grid-template-rows: 56px 1fr auto; height: 100vh; max-width: 900px; margin: 0 auto; position: relative; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--bg); position: relative; z-index: 10; }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 26px; height: 26px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px var(--accent-glow); }
    .logo-mark svg { width: 14px; height: 14px; fill: #07080d; }
    .logo-text { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: var(--text); }
    .logo-text span { color: var(--accent); }

    .status-pill { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; transition: all 0.3s; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); transition: background 0.3s, box-shadow 0.3s; }
    .status-pill.connected .status-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse-dot 2s infinite; }
    .status-pill.error .status-dot { background: var(--error); box-shadow: 0 0 8px var(--error); }
    .status-pill.thinking .status-dot { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse-dot 0.8s infinite; }
    .status-pill.connected { border-color: var(--accent-dim); }
    .status-pill.error { border-color: #3a1a1a; }

    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .6; transform: scale(0.85); } }

    .header-actions { display: flex; gap: 8px; }
    .icon-btn { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .icon-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
    .icon-btn svg { width: 14px; height: 14px; }

    /* Messages */
    #messages { overflow-y: auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Empty state */
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--text-muted); padding: 48px 24px; text-align: center; animation: fadeUp 0.5s ease; }
    .empty-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
    .empty-icon svg { width: 24px; height: 24px; stroke: var(--accent); }
    .empty-state h2 { font-size: 16px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.01em; }
    .empty-state p { font-size: 13px; max-width: 320px; line-height: 1.7; color: var(--text-muted); }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
    .suggestion-chip { font-family: var(--mono); font-size: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; color: var(--text-dim); cursor: pointer; transition: all 0.2s; }
    .suggestion-chip:hover { border-color: var(--accent-dim); color: var(--accent); background: rgba(61,255,160,0.04); }

    /* Message rows */
    .msg-row { display: flex; flex-direction: column; gap: 2px; animation: fadeUp 0.3s ease; max-width: 100%; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .msg-row.user { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }

    .msg-meta { font-size: 10px; font-family: var(--mono); color: var(--text-muted); padding: 0 6px; display: flex; gap: 8px; align-items: center; }
    .msg-meta .role-label { color: var(--accent); }

    .msg-bubble { max-width: min(72%, 640px); padding: 11px 16px; border-radius: var(--radius-lg); font-size: 13.5px; line-height: 1.65; position: relative; word-break: break-word; }
    .msg-row.user .msg-bubble { background: var(--user-bg); border: 1px solid var(--user-border); border-bottom-right-radius: 4px; color: var(--text); }
    .msg-row.assistant .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
    .msg-row.assistant.error .msg-bubble { background: rgba(255,95,95,0.06); border-color: rgba(255,95,95,0.25); color: var(--error); }

    .msg-bubble pre { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; margin: 10px 0; overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.5; }
    .msg-bubble code { font-family: var(--mono); font-size: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
    .msg-bubble pre code { background: none; border: none; padding: 0; }

    /* Thinking indicator */
    .thinking-row { display: flex; align-items: flex-start; animation: fadeUp 0.3s ease; }
    .thinking-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; border-radius: var(--radius-lg); padding: 12px 18px; display: flex; align-items: center; gap: 14px; }
    .thinking-label { font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; }
    .thinking-dots { display: flex; gap: 5px; align-items: center; }
    .thinking-dots span { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.3; animation: blink 1.2s infinite; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

    /* Time divider */
    .time-divider { text-align: center; font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin: 12px 0 6px; display: flex; align-items: center; gap: 12px; }
    .time-divider::before, .time-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Input */
    #input-area { padding: 16px 24px 20px; border-top: 1px solid var(--border); background: var(--bg); }
    .input-shell { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); transition: border-color 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
    .input-shell:focus-within { border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(61,255,160,0.06); }
    .input-shell.disabled { opacity: 0.5; pointer-events: none; }

    #prompt { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; resize: none; padding: 14px 56px 14px 16px; min-height: 52px; max-height: 180px; overflow-y: auto; scrollbar-width: thin; }
    #prompt::placeholder { color: var(--text-muted); }
    #prompt::-webkit-scrollbar { width: 3px; }
    #prompt::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #send-btn { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 34px; border-radius: 8px; background: var(--accent); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    #send-btn:hover { background: #5fffc0; box-shadow: 0 0 16px var(--accent-glow); }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { background: var(--border2); cursor: not-allowed; box-shadow: none; }
    #send-btn svg { width: 16px; height: 16px; fill: #07080d; }

    .input-footer { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0; }
    .input-hint { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
    .input-hint kbd { background: var(--surface2); border: 1px solid var(--border2); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
    .char-count { font-family: var(--mono); font-size: 10px; color: var(--text-muted); }

    /* Connection overlay */
    #conn-overlay { position: fixed; inset: 0; background: rgba(7,8,13,0.88); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s ease; }
    #conn-overlay.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .conn-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 36px 40px; max-width: 400px; width: 90%; text-align: center; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 32px 80px rgba(0,0,0,0.5); }
    .conn-spinner { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .conn-card h3 { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 0.05em; color: var(--text); }
    .conn-card p { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
    .conn-url { font-family: var(--mono); font-size: 11px; color: var(--accent); background: rgba(61,255,160,0.06); border: 1px solid var(--accent-dim); border-radius: 8px; padding: 8px 14px; word-break: break-all; }
    .retry-btn { background: var(--accent); color: #07080d; border: none; border-radius: 10px; padding: 10px 24px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; transition: all 0.2s; }
    .retry-btn:hover { background: #5fffc0; box-shadow: 0 0 20px var(--accent-glow); }

    /* Scroll btn */
    #scroll-btn { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); border-radius: 20px; padding: 6px 16px; font-size: 11px; font-family: var(--mono); cursor: pointer; opacity: 0; transition: all 0.25s; pointer-events: none; display: flex; align-items: center; gap: 6px; z-index: 50; }
    #scroll-btn.visible { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
    #scroll-btn:hover { background: var(--surface); border-color: var(--accent-dim); color: var(--accent); }

    /* Toast */
    #toast { position: fixed; bottom: 30px; right: 24px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 16px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 200; }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { color: var(--accent); border-color: var(--accent-dim); }
    #toast.err { color: var(--error); border-color: rgba(255,95,95,0.3); }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      #messages { padding: 20px 16px; }
      #input-area { padding: 12px 16px 16px; }
      .msg-bubble { max-width: 90%; }
    }
  </style>
</head>
<body>

<div id="conn-overlay">
  <div class="conn-card">
    <div class="conn-spinner" id="conn-spinner"></div>
    <h3 id="conn-title">CONNECTING</h3>
    <p id="conn-desc">Establishing WebSocket tunnel...</p>
    <div class="conn-url">ws://localhost:8000/ws/sss</div>
    <button class="retry-btn" id="retry-btn" style="display:none" onclick="initWS()">&#8635; RETRY</button>
  </div>
</div>

<button id="scroll-btn" onclick="scrollToBottom(true)">
  <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12"><path d="M8 12L2 6h12z"/></svg>
  New messages
</button>

<div id="toast"></div>

<div id="app">
  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16"><path d="M8 1L1 5v6l7 4 7-4V5L8 1zm0 2.2l4.8 2.8L8 8.8 3.2 6 8 3.2zM2.5 7.1L7 9.6V13l-4.5-2.6V7.1zm5.5 6 4.5-2.6V7.1L8 9.6v3.5z"/></svg>
      </div>
      <span class="logo-text">AGENT<span>/</span>CONSOLE</span>
    </div>

    <div class="status-pill" id="status-pill">
      <span class="status-dot"></span>
      <span id="status-text">Connecting</span>
    </div>

    <div class="header-actions">
      <button class="icon-btn" title="Clear chat" onclick="clearChat()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4,6 4,13 12,13 12,6"/><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="4" x2="6" y2="2"/><line x1="10" y1="4" x2="10" y2="2"/></svg>
      </button>
      <button class="icon-btn" title="Copy last response" onclick="copyLast()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="9" rx="1"/><path d="M3 11V3a1 1 0 0 1 1-1h7"/></svg>
      </button>
    </div>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <h2>Agent ready</h2>
      <p>Connected to your agentic engine. Send a message to begin.</p>
      <div class="suggestions">
        <span class="suggestion-chip" onclick="useSuggestion(this)">What can you do?</span>
        <span class="suggestion-chip" onclick="useSuggestion(this)">Summarize your capabilities</span>
        <span class="suggestion-chip" onclick="useSuggestion(this)">Hello, introduce yourself</span>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-shell" id="input-shell">
      <textarea id="prompt" placeholder="Message the agent..." rows="1" maxlength="8000"></textarea>
      <button id="send-btn" title="Send (Enter)" disabled>
        <svg viewBox="0 0 16 16"><path d="M1 8L15 1 8 15 7 9 1 8z"/></svg>
      </button>
    </div>
    <div class="input-footer">
      <span class="input-hint"><kbd>Enter</kbd> send &nbsp;&middot;&nbsp; <kbd>Shift+Enter</kbd> newline</span>
      <span class="char-count" id="char-count">0 / 8000</span>
    </div>
  </div>
</div>

<script>
  const WS_URL = 'ws://localhost:8000/ws/sss';
  const RECONNECT_MS = 3000;

  let ws = null, isThinking = false, lastBubble = null, msgCount = 0;
  let connected = false, retryTimer = null, sessionStart = new Date();

  const $msg      = document.getElementById('messages');
  const $prompt   = document.getElementById('prompt');
  const $sendBtn  = document.getElementById('send-btn');
  const $pill     = document.getElementById('status-pill');
  const $pillTxt  = document.getElementById('status-text');
  const $overlay  = document.getElementById('conn-overlay');
  const $cTitle   = document.getElementById('conn-title');
  const $cDesc    = document.getElementById('conn-desc');
  const $cSpin    = document.getElementById('conn-spinner');
  const $retryBtn = document.getElementById('retry-btn');
  const $shell    = document.getElementById('input-shell');
  const $cc       = document.getElementById('char-count');
  const $scrollB  = document.getElementById('scroll-btn');
  const $toast    = document.getElementById('toast');

  function setStatus(cls, label) {
    $pill.className = 'status-pill ' + cls;
    $pillTxt.textContent = label;
  }

  function toast(msg, cls = '') {
    $toast.textContent = msg;
    $toast.className = 'show ' + cls;
    clearTimeout($toast._t);
    $toast._t = setTimeout(() => { $toast.className = ''; }, 2800);
  }

  function scrollToBottom(force) {
    const atBottom = $msg.scrollHeight - $msg.scrollTop - $msg.clientHeight < 120;
    if (force || atBottom) { $msg.scrollTop = $msg.scrollHeight; $scrollB.classList.remove('visible'); }
  }

  $msg.addEventListener('scroll', () => {
    if ($msg.scrollHeight - $msg.scrollTop - $msg.clientHeight < 100) $scrollB.classList.remove('visible');
  });

  function fmt(d = new Date()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function esc(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(text) {
    let o = esc(text);
    o = o.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<pre><code>${c}</code></pre>`);
    o = o.replace(/`([^`]+)`/g, '<code>$1</code>');
    o = o.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    o = o.replace(/\*(.+?)\*/g, '<em>$1</em>');
    o = o.replace(/\n/g, '<br>');
    return o;
  }

  function removeEmpty() {
    const e = document.getElementById('empty-state');
    if (e) e.remove();
  }

  function addDivider() {
    if (msgCount === 0) {
      const d = document.createElement('div');
      d.className = 'time-divider';
      d.textContent = fmt(sessionStart);
      $msg.appendChild(d);
    }
  }

  function addUserMsg(text) {
    removeEmpty(); addDivider(); msgCount++;
    const r = document.createElement('div');
    r.className = 'msg-row user';
    r.innerHTML = `<div class="msg-meta"><span>${fmt()}</span></div><div class="msg-bubble">${render(text)}</div>`;
    $msg.appendChild(r);
    scrollToBottom();
  }

  function showThinking() {
    removeThinking();
    const r = document.createElement('div');
    r.className = 'thinking-row'; r.id = 'thinking';
    r.innerHTML = `<div class="thinking-bubble"><span class="thinking-label">thinking</span><div class="thinking-dots"><span></span><span></span><span></span></div></div>`;
    $msg.appendChild(r);
    scrollToBottom();
  }

  function removeThinking() {
    const e = document.getElementById('thinking');
    if (e) e.remove();
  }

  function addAgentMsg(text, isErr = false) {
    removeThinking(); msgCount++;
    const r = document.createElement('div');
    r.className = 'msg-row assistant' + (isErr ? ' error' : '');
    r.innerHTML = `<div class="msg-meta"><span class="role-label">agent</span><span>${fmt()}</span></div><div class="msg-bubble">${render(text)}</div>`;
    $msg.appendChild(r);
    lastBubble = r.querySelector('.msg-bubble');
    const far = $msg.scrollHeight - $msg.scrollTop - $msg.clientHeight > 200;
    if (far) $scrollB.classList.add('visible'); else scrollToBottom();
  }

  function initWS() {
    if (ws) { try { ws.close(); } catch(e){} }
    clearTimeout(retryTimer);
    connected = false;
    $overlay.classList.remove('hidden');
    $cSpin.style.display = 'block';
    $cTitle.textContent = 'CONNECTING';
    $cDesc.textContent = 'Establishing WebSocket tunnel...';
    $retryBtn.style.display = 'none';
    setStatus('', 'Connecting');
    $sendBtn.disabled = true;

    try { ws = new WebSocket(WS_URL); }
    catch(e) { connFail('Invalid URL: ' + e.message); return; }

    ws.addEventListener('open', () => {
      connected = true;
      $overlay.classList.add('hidden');
      setStatus('connected', 'Connected');
      $sendBtn.disabled = false;
      toast('Connected to agent', 'success');
      sessionStart = new Date();
    });

    ws.addEventListener('message', (e) => {
      if (!isThinking) return;
      isThinking = false;
      setStatus('connected', 'Connected');
      $shell.classList.remove('disabled');
      $sendBtn.disabled = false;
      $prompt.focus();
      const txt = e.data;
      addAgentMsg(txt, txt.startsWith('Error:'));
    });

    ws.addEventListener('close', () => {
      connected = false;
      setStatus('error', 'Disconnected');
      if (isThinking) {
        removeThinking();
        addAgentMsg('Connection lost. Reconnecting...', true);
        isThinking = false;
        $shell.classList.remove('disabled');
        $sendBtn.disabled = false;
      }
      retryTimer = setTimeout(initWS, RECONNECT_MS);
    });

    ws.addEventListener('error', () => {
      if (!connected) connFail('Cannot reach server. Retrying...');
    });
  }

  function connFail(msg) {
    $cSpin.style.display = 'none';
    $cTitle.textContent = 'FAILED';
    $cDesc.textContent = msg;
    $retryBtn.style.display = 'block';
    setStatus('error', 'Error');
    retryTimer = setTimeout(initWS, RECONNECT_MS);
  }

  function sendMessage() {
    const text = $prompt.value.trim();
    if (!text || isThinking || !connected) return;
    addUserMsg(text);
    $prompt.value = ''; autoResize(); updateCC();
    isThinking = true;
    setStatus('thinking', 'Thinking...');
    $shell.classList.add('disabled');
    $sendBtn.disabled = true;
    showThinking();
    try { ws.send(text); }
    catch(e) {
      removeThinking();
      addAgentMsg('Send error: ' + e.message, true);
      isThinking = false; setStatus('error', 'Error');
      $shell.classList.remove('disabled'); $sendBtn.disabled = false;
    }
  }

  function autoResize() {
    $prompt.style.height = 'auto';
    $prompt.style.height = Math.min($prompt.scrollHeight, 180) + 'px';
  }

  function updateCC() {
    const n = $prompt.value.length;
    $cc.textContent = n + ' / 8000';
    $cc.style.color = n > 7000 ? 'var(--warning)' : '';
  }

  $prompt.addEventListener('input', () => { autoResize(); updateCC(); });
  $prompt.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $sendBtn.addEventListener('click', sendMessage);

  function clearChat() {
    $msg.querySelectorAll('.msg-row, .thinking-row, .time-divider').forEach(e => e.remove());
    msgCount = 0; lastBubble = null; sessionStart = new Date();
    if (!document.getElementById('empty-state')) {
      const es = document.createElement('div');
      es.className = 'empty-state'; es.id = 'empty-state';
      es.innerHTML = `
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
        <h2>Chat cleared</h2>
        <p>Session history erased. Start a new conversation.</p>
        <div class="suggestions">
          <span class="suggestion-chip" onclick="useSuggestion(this)">What can you do?</span>
          <span class="suggestion-chip" onclick="useSuggestion(this)">Summarize your capabilities</span>
          <span class="suggestion-chip" onclick="useSuggestion(this)">Hello, introduce yourself</span>
        </div>`;
      $msg.appendChild(es);
    }
    toast('Chat cleared');
  }

  function copyLast() {
    if (!lastBubble) { toast('Nothing to copy', 'err'); return; }
    navigator.clipboard.writeText(lastBubble.innerText)
      .then(() => toast('Copied to clipboard', 'success'))
      .catch(() => toast('Copy failed', 'err'));
  }

  function useSuggestion(el) {
    $prompt.value = el.textContent;
    $prompt.focus(); updateCC(); autoResize();
  }

  initWS();
</script>
</body>
</html>
